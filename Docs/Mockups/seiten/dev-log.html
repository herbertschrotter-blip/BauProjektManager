<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.5 Entwicklerwerkzeuge – Log</title>
<link rel="stylesheet" href="../theme-app.css">
<script src="../theme.js"></script>
<!--
1.5 Entwicklerwerkzeuge – Log – aus altem Mockup Settings/02_DevTools/01_Log.html übernommen
(alter Titel: „BPM Dev Tools — Log-Tab mit Filter-Dropdown“). Die drei Varianten, die das alte Mockup untereinander
zeigte, sind jetzt Zustände der Vorführleiste. Erläuterungen des alten Mockups (Texte außerhalb des Fensters):

VARIANTE 1 — Hauptansicht: "Letzte N Zeilen (eigene)" gewählt
  ── Variante 1 — Hauptansicht mit aktiver Eigene-Zahl-Eingabe ──
  Default-Zustand wenn User "Letzte N Zeilen (eigene)" gewählt hat. Zahleneingabe nur sichtbar wenn diese Option aktiv ist.

VARIANTE 2 — Dropdown geöffnet (alle 5 Optionen)
  ── Variante 2 — Dropdown geöffnet ──
  Alle 5 Auswahlpunkte. "Letzte 200 Zeilen" ist der Default beim allerersten Öffnen. "Komplettes Logfile" zeigt
  Warn-Hinweis bei großen Dateien.

VARIANTE 3 — Edge Case "Letzte Session" mit Hinweis-Banner
  ── Variante 3 — Edge Case: keine vorherige Session im Logfile ──
  Wenn nur ein App-Start-Marker im aktuellen Logfile gefunden wird, wird das Vortags-Logfile geprüft. Während dieser
  Suche zeigt das Banner Status. Kopieren-Button bleibt disabled bis Inhalt geladen.

PERSISTIERUNG — device-settings.json Schema-Erweiterung
  ── Persistierung — device-settings.json (neuer Bereich) ──
  Auswahl wird sofort beim Wechsel persistiert (kein Speichern-Button). Beim App-Neustart wiederhergestellt.
  Device-spezifisch — nicht über OneDrive synchronisiert.

  {
    "deviceId": "firmenlaptop-...",
    "localUserId": "hs-001",
    ...
    "devTools": {
      "logFilter": {
        "mode": "lastNLines",
        "customLineCount": 500
      }
    }
  }

  Mode-Werte (Enum):
    "last200Lines"     → Letzte 200 Zeilen (Default)
    "lastNLines"       → Letzte N Zeilen (nutzt customLineCount)
    "currentSession"   → Aktuelle Session
    "previousSession"  → Letzte Session
    "entireFile"       → Komplettes Logfile

Tab System-Info ist ein toter Pfad (gestrichelt, „Mockup folgt“). Schließen (Knopf und rotes Fenster-X) führt zu
2.1 Einstellungen – Allgemein, Tab Reset zu 1.6.
-->
<style>
  .rahmen{background:var(--BpmBgBase);font-family:'Segoe UI',sans-serif;color:var(--BpmTextPrimary);font-size:13px}
  .dialog{box-sizing:border-box;width:100%;height:100%;background:var(--BpmBgBase);border:1px solid var(--BpmBorderDefault);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
  .dialog-title{background:var(--BpmBgSurface);padding:10px 16px;border-bottom:1px solid var(--BpmBorderDefault);display:flex;justify-content:space-between;align-items:center}
  .dialog-title-text{color:var(--BpmTextBright);font-size:13px;font-weight:600}
  .win-controls{display:flex;gap:8px}
  .win-btn{width:12px;height:12px;border-radius:50%;background:var(--BpmBgInput)}
  .win-btn.close{background:var(--BpmError)}
  .tabs{background:var(--BpmBgBase);padding:0 16px;border-bottom:1px solid var(--BpmBorderDefault);display:flex;gap:0}
  .tab{padding:11px 18px;font-size:13px;color:var(--BpmTextSecondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--BpmTextPrimary);background:var(--BpmBgElevated)}
  .tab.act{color:var(--BpmTextBright);font-weight:600;border-bottom-color:var(--BpmAccentPrimary);background:var(--BpmBgBase)}
  .content{padding:18px;flex:1;overflow:auto}

  /* Header row: filter left, actions right */
  .log-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .filter-group{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .filter-label{color:var(--BpmTextSecondary);font-size:12px;white-space:nowrap}
  .filter-select{background:var(--BpmBgInput);border:1px solid var(--BpmBorderDefault);border-radius:3px;padding:6px 28px 6px 10px;color:var(--BpmTextPrimary);font-size:12px;cursor:pointer;min-width:200px;position:relative;font-family:'Segoe UI'}
  .filter-select::after{content:'▼';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--BpmTextSecondary);font-size:9px;pointer-events:none}
  .filter-input{background:var(--BpmBgInput);border:1px solid var(--BpmAccentPrimary);border-radius:3px;padding:6px 8px;color:var(--BpmTextPrimary);font-size:12px;width:70px;font-family:Consolas,monospace;outline:none}
  .filter-range{color:var(--BpmTextSecondary);font-size:11px;white-space:nowrap}
  .actions{display:flex;gap:8px;flex-shrink:0}
  .btn-secondary{background:transparent;border:1px solid var(--BpmBorderDefault);border-radius:3px;padding:6px 12px;color:var(--BpmTextPrimary);font-size:12px;cursor:pointer;font-family:'Segoe UI'}
  .btn-secondary:hover{background:var(--BpmBgHover)}

  /* Status hint */
  .status-hint{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:0 2px}
  .status-dot{color:var(--BpmSuccess);font-size:11px}
  .status-text{color:var(--BpmTextSecondary);font-size:11px}

  /* Log content */
  .log-area{background:var(--BpmBgSurface);border:1px solid var(--BpmBorderDefault);border-radius:3px;padding:12px;font-family:Consolas,monospace;font-size:11px;line-height:1.5;color:var(--BpmTextPrimary);height:240px;overflow:auto;white-space:pre}
  .log-time{color:var(--BpmTextSecondary)}
  .log-inf{color:var(--BpmInfo)}
  .log-wrn{color:var(--BpmWarning)}
  .log-err{color:var(--BpmError)}
  .log-marker{color:var(--BpmAccentPrimary);font-weight:600}

  /* Footer */
  .footer{background:var(--BpmBgBase);padding:12px 18px;border-top:1px solid var(--BpmBorderDefault);display:flex;justify-content:flex-end}

  /* Dropdown panel (open state in Variant 2) */
  .dd-panel{background:var(--BpmBgInput);border:1px solid var(--BpmBorderDefault);border-radius:3px;padding:0;min-width:240px;margin-left:80px;margin-top:-2px}
  .dd-item{padding:8px 12px;color:var(--BpmTextPrimary);font-size:12px;cursor:pointer;border-left:2px solid transparent}
  .dd-item:hover{background:var(--BpmBgHover)}
  .dd-item.act{background:var(--BpmBgActive);border-left-color:var(--BpmAccentPrimary);color:var(--BpmTextBright)}
  .dd-hint{color:var(--BpmTextSecondary);font-size:10px;margin-left:4px}
  .dd-warn{color:var(--BpmWarning);font-size:10px;margin-left:4px}

  /* Warning banner – altes Mockup hatte #22F0AD4E (WPF-ARGB); jetzt Theme-Token (Entscheidung Herbert 2026-11-19) */
  .warn-banner{background:var(--BpmBadgeBgWarning);border:1px solid var(--BpmWarning);border-radius:3px;padding:10px 12px;color:var(--BpmWarning);font-size:12px}
</style>
</head>
<body>
<template id="t-kopf">
  <div class="dialog-title">
    <span class="dialog-title-text">🔧 Dev Tools [DEBUG]</span>
    <div class="win-controls">
      <div class="win-btn"></div>
      <div class="win-btn"></div>
      <div class="win-btn close" style="cursor:pointer" onclick="Mockup.geh('einstellungen-allgemein')"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab" style="border-bottom:3px dashed var(--BpmTextSecondary);opacity:0.7" onclick="alert('Mockup folgt: 02_DevTools/03_SystemInfo.html')">⧉ System-Info</div>
    <div class="tab act">📄 Log</div>
    <div class="tab" onclick="Mockup.geh('dev-zuruecksetzen')">🗑 Reset</div>
  </div>
</template>

<template id="t-fuss">
  <div class="footer">
    <button class="btn-secondary" onclick="Mockup.geh('einstellungen-allgemein')">Schließen</button>
  </div>
</template>

<!-- VARIANTE 1 — Hauptansicht: "Letzte N Zeilen (eigene)" gewählt -->
<template id="t-v1">
  <div class="content">
    <div class="log-header">
      <div class="filter-group">
        <span class="filter-label">Anzeigen:</span>
        <div class="filter-select">Letzte N Zeilen (eigene)</div>
        <input type="text" class="filter-input" value="500">
        <span class="filter-range">(10-10000)</span>
      </div>
      <div class="actions">
        <button class="btn-secondary">⧉ Kopieren</button>
        <button class="btn-secondary">↻ Aktualisieren</button>
      </div>
    </div>

    <div class="status-hint">
      <span class="status-dot">●</span>
      <span class="status-text">500 Zeilen geladen aus bpm-20260504.log (4.7 MB)</span>
    </div>

    <div class="log-area"><span class="log-time">2026-05-04 14:22:15.847</span> <span class="log-marker">═══ APP START · v0.28.4 · 2026-05-04 14:22:15 · PID 18432 ═══</span>
<span class="log-time">2026-05-04 14:22:16.103</span> <span class="log-inf">[INF]</span> Application starting up
<span class="log-time">2026-05-04 14:22:16.241</span> <span class="log-inf">[INF]</span> Settings loaded from D:\OneDrive\AppData\BPM\settings.json
<span class="log-time">2026-05-04 14:22:16.512</span> <span class="log-inf">[INF]</span> Database opened: bpm.db (12.4 MB, 1247 plans)
<span class="log-time">2026-05-04 14:22:16.788</span> <span class="log-inf">[INF]</span> ProfileManager loaded 14 profiles from .bpm/profiles/
<span class="log-time">2026-05-04 14:22:17.024</span> <span class="log-wrn">[WRN]</span> Profil 'Statik-Old' verworfen: keine Recognition-Regeln vorhanden
<span class="log-time">2026-05-04 14:22:17.198</span> <span class="log-inf">[INF]</span> Main window opened
<span class="log-time">2026-05-04 14:23:42.581</span> <span class="log-inf">[INF]</span> User opened PlanManager for project 'ÖWG Dobl'
<span class="log-time">2026-05-04 14:24:18.331</span> <span class="log-inf">[INF]</span> Profile 'Polier' matched 14 of 28 candidate files
<span class="log-time">2026-05-04 14:24:18.502</span> <span class="log-inf">[INF]</span> Import preview opened
<span class="log-time">...</span></div>
  </div>
</template>

<!-- VARIANTE 2 — Dropdown geöffnet (alle 5 Optionen) -->
<template id="t-v2">
  <div class="content">
    <div class="log-header">
      <div class="filter-group">
        <span class="filter-label">Anzeigen:</span>
        <div class="filter-select">Letzte 200 Zeilen</div>
      </div>
      <div class="actions">
        <button class="btn-secondary">⧉ Kopieren</button>
        <button class="btn-secondary">↻ Aktualisieren</button>
      </div>
    </div>

    <div class="dd-panel">
      <div class="dd-item act">Letzte 200 Zeilen<span class="dd-hint">(Standard)</span></div>
      <div class="dd-item">Letzte N Zeilen (eigene)</div>
      <div class="dd-item">Aktuelle Session</div>
      <div class="dd-item">Letzte Session</div>
      <div class="dd-item">Komplettes Logfile<span class="dd-warn">⚠ groß</span></div>
    </div>

    <div style="height:200px"></div>
  </div>
</template>

<!-- VARIANTE 3 — Edge Case "Letzte Session" mit Hinweis-Banner -->
<template id="t-v3">
  <div class="content">
    <div class="log-header">
      <div class="filter-group">
        <span class="filter-label">Anzeigen:</span>
        <div class="filter-select">Letzte Session</div>
      </div>
      <div class="actions">
        <button class="btn-secondary" style="opacity:0.4;cursor:not-allowed">⧉ Kopieren</button>
        <button class="btn-secondary">↻ Aktualisieren</button>
      </div>
    </div>

    <div class="warn-banner">⚠ Keine vorherige Session im aktuellen Logfile gefunden. Vortags-Logfile bpm-20260503.log wird geprüft…</div>

    <div style="height:8px"></div>

    <div class="log-area" style="opacity:0.4"><span class="log-time">…</span> <span class="status-text">Suche läuft, bitte warten</span></div>
  </div>
</template>
<script>
const T = (id) => document.getElementById(id).innerHTML;
const KOPF = T('t-kopf'), FUSS = T('t-fuss');
const INHALT = { v1: T('t-v1'), v2: T('t-v2'), v3: T('t-v3') };
Mockup.start({ nr: '1.5', titel: 'Entwicklerwerkzeuge – Log', version: '1.1',
  zustaende: [['v1','1 Eigene Zeilenzahl'],['v2','2 Dropdown geöffnet'],['v3','3 Keine vorherige Session']],
  zeige: (s) => `<div class="dialog">${KOPF}${INHALT[s.z]}${FUSS}</div>`,
});
</script>
</body>
</html>
