<!--
1.6 Entwicklerwerkzeuge – Zurücksetzen – aus altem Mockup Settings/02_DevTools/02_Reset.html übernommen
(alter Titel: „BPM Dev Tools — Reset-Tab mit Persistenz-Inventar (BPM-104)“). Ein Screen, keine Zustände.

Erläuterung des alten Mockups (Text außerhalb des Fensters):
  ── DevTools Reset-Tab — Persistenz-Inventar (BPM-104) ──
  Quick-Reset-Karten oben (5 Sammel-Aktionen) + Detail-Auswahl unten (Inventar gruppiert nach Typ, Checkboxen fuer
  Bulk-Reset, Aktions-Buttons pro Eintrag fuer Ordner oeffnen / Datei oeffnen mit Standard-App / Im Explorer markieren).
  Inventar wird dynamisch aus IPersistenceRegistry + Filesystem-Scan zusammengestellt.

Kommentare des alten Mockups: BPM Dark Theme Tokens (Colors.xaml) · Tab-Bar Variante 4 (BPM-079 Standard) ·
Gruppe als zusammenhaengende Card mit Header + Items vereint · Items innerhalb der Gruppe vereint mit Header, nur
dezente Trennstriche · Gruppe LOGS initial eingeklappt als Beispiel.

Tab System-Info ist ein toter Pfad (gestrichelt, „Mockup folgt“). Rotes Fenster-X führt zu 2.1 Einstellungen –
Allgemein, Tab Log zu 1.5. „Schliessen“ im Fuß hatte im alten Mockup keine Aktion und hat auch hier keine.
-->
<style>
  /* BPM Dark Theme Tokens (Colors.xaml) */
  .rahmen{background:var(--BpmBgBase);font-family:'Segoe UI',sans-serif;color:var(--BpmTextPrimary);font-size:13px}

  /* Dialog-Frame */
  .dialog{box-sizing:border-box;width:100%;height:100%;background:var(--BpmBgBase);border:1px solid var(--BpmBorderDefault);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
  .dialog-title{background:var(--BpmBgSurface);padding:10px 16px;border-bottom:1px solid var(--BpmBorderDefault);display:flex;justify-content:space-between;align-items:center}
  .dialog-title-text{color:var(--BpmTextBright);font-size:13px;font-weight:600}
  .win-controls{display:flex;gap:8px}
  .win-btn{width:12px;height:12px;border-radius:50%;background:var(--BpmBgInput)}
  .win-btn.close{background:var(--BpmError)}

  /* Tab-Bar (Variante 4 — BPM-079 Standard) */
  .tabs-bar{background:var(--BpmBgSurface);border-bottom:1px solid var(--BpmBorderDefault);padding:0 16px;display:flex;gap:0}
  .tab{padding:12px 20px;font-size:13px;color:var(--BpmTextSecondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
  .tab:hover{color:var(--BpmTextPrimary);background:var(--BpmBgHover)}
  .tab.act{color:var(--BpmTextBright);font-weight:600;border-bottom-color:var(--BpmAccentPrimary);background:var(--BpmBgBase)}

  /* Content */
  .content{padding:18px 20px;flex:1;overflow-y:auto}

  /* Section Header */
  .sec-title{color:var(--BpmAccentPrimary);font-weight:bold;font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:0.5px}
  .sec-desc{color:var(--BpmTextSecondary);font-size:11px;margin:0 0 12px}

  /* Quick-Reset Cards Grid */
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
  .quick-card{background:var(--BpmBgSurface);border:1px solid var(--BpmBorderDefault);border-radius:4px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color 0.15s}
  .quick-card:hover{border-color:var(--BpmAccentPrimary)}
  .quick-card.danger:hover{border-color:var(--BpmError)}
  .quick-icon{font-size:16px;color:var(--BpmError)}
  .quick-card-text{flex:1;display:flex;flex-direction:column;gap:2px}
  .quick-name{color:var(--BpmTextBright);font-size:12px;font-weight:500}
  .quick-info{color:var(--BpmTextSecondary);font-size:10px}

  /* Divider */
  .divider{height:1px;background:var(--BpmBorderDefault);margin:0 0 16px}

  /* Inventar-Tabelle */
  .inv-header{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;padding:0 2px}
  .check-all{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--BpmTextSecondary);cursor:pointer}
  .group-count{color:var(--BpmTextSecondary);font-size:11px}

  /* Gruppe als zusammenhaengende Card mit Header + Items vereint */
  .inv-group{margin-bottom:14px;background:var(--BpmBgSurface);border:1px solid var(--BpmBorderDefault);border-radius:3px;overflow:hidden}
  .inv-group > summary{color:var(--BpmAccentPrimary);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;list-style:none;user-select:none}
  .inv-group > summary:hover{background:var(--BpmBgElevated)}
  .inv-group > summary::-webkit-details-marker{display:none}
  .inv-group[open] > summary{border-bottom:1px solid var(--BpmBorderDefault)}
  .group-chevron{color:var(--BpmTextSecondary);font-size:9px;width:10px;display:inline-block}
  .inv-group:not([open]) .group-chevron::before{content:'▸'}
  .inv-group[open] .group-chevron::before{content:'▾'}
  .group-title-text{flex:1;color:var(--BpmAccentPrimary)}
  .group-meta{color:var(--BpmTextSecondary);font-size:10px;font-weight:400;text-transform:none;letter-spacing:0}

  /* Items innerhalb der Gruppe — vereint mit Header, nur dezente Trennstriche */
  .inv-row{background:transparent;border:none;border-bottom:1px solid var(--BpmBorderDefault);border-radius:0;padding:8px 10px 8px 26px;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
  .inv-row:last-child{border-bottom:none}
  .inv-row:hover{background:var(--BpmBgElevated)}
  .inv-checkbox{width:14px;height:14px;border:1.5px solid var(--BpmTextSecondary);border-radius:2px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .inv-checkbox.checked{background:var(--BpmAccentPrimary);border-color:var(--BpmAccentPrimary);color:var(--BpmTextOnAccent);font-size:10px;font-weight:bold}
  .inv-info{display:flex;flex-direction:column;gap:2px;min-width:0}
  .inv-name{color:var(--BpmTextBright);font-size:12px;font-weight:500}
  .inv-path{color:var(--BpmTextSecondary);font-size:10px;font-family:Consolas,monospace;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
  .inv-meta{color:var(--BpmTextSecondary);font-size:10px;text-align:right;white-space:nowrap}
  .inv-actions{display:flex;gap:2px}

  /* Action-Buttons (klein) */
  .act-btn{background:transparent;border:1px solid var(--BpmBorderDefault);border-radius:3px;padding:3px 6px;color:var(--BpmTextPrimary);font-size:10px;cursor:pointer;font-family:'Segoe UI'}
  .act-btn:hover{background:var(--BpmBgHover);border-color:var(--BpmAccentPrimary);color:var(--BpmTextBright)}

  /* Scope-Badge */
  .scope-badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600;margin-left:6px;vertical-align:middle}
  .scope-local{background:var(--BpmBgHover);color:var(--BpmTextPrimary)}
  .scope-cloud{background:var(--BpmBgActive);color:var(--BpmInfo)}
  .scope-project{background:#0F6E56;color:var(--BpmSuccess)}

  /* Sammel-Aktion am Ende – #2a1818 (Hintergrund) und #FF5757 (Hover) gibt es im Theme nicht */
  .bulk-action{background:#2a1818;border:1px solid var(--BpmError);border-radius:4px;padding:12px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between}
  .bulk-info{color:var(--BpmTextPrimary);font-size:12px}
  .bulk-info-count{color:var(--BpmError);font-weight:600}
  .btn-danger{background:var(--BpmError);border:none;border-radius:3px;padding:8px 16px;color:var(--BpmTextOnAccent);font-size:12px;font-weight:500;cursor:pointer;font-family:'Segoe UI'}
  .btn-danger:hover{background:#FF5757}
  .btn-danger:disabled{background:var(--BpmBgInput);color:var(--BpmTextSecondary);cursor:not-allowed}

  /* Footer */
  .footer{background:var(--BpmBgSurface);padding:10px 16px;border-top:1px solid var(--BpmBorderDefault);display:flex;justify-content:flex-end}
  .btn-secondary{background:transparent;border:1px solid var(--BpmBorderDefault);border-radius:3px;padding:6px 16px;color:var(--BpmTextPrimary);font-size:12px;cursor:pointer;font-family:'Segoe UI'}
  .btn-secondary:hover{background:var(--BpmBgHover)}
</style>
</head>
<body>
<template id="t-app">
<div class="dialog">

        <div class="inv-actions">
          <button class="act-btn" title="Ordner oeffnen">📁</button>
          <button class="act-btn" title="Mit Standard-App oeffnen">📄</button>
          <button class="act-btn" title="Im Explorer markieren">🎯</button>

    <!-- Gruppe: KONFIG -->
