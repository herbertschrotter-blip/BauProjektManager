<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2.1 Allgemein</title>
<link rel="stylesheet" href="../theme-app.css">
<script src="../theme.js"></script>
<!--
2.1 Einstellungen – Allgemein – aus altem Mockup Settings/01_Einstellungen/01_Allgemein.html übernommen
(alter Titel: „BPM Einstellungen — Tab-Variante 4: Stärkere Underline“; Schild oben rechts im alten Mockup:
„Variante 4 — Stärkere Underline“ – die gewählte Tab-Variante, kein eigener Zustand).

Kommentar des alten Mockups zum Abschnitt Claude:
  Claude (ADR-067): Schalter wie gebaut (v0.28.216) + NEU Modellwahl (BPM-131 E9, Entscheidung Herbert 2026-11-18).
  Geraete-lokal (device-settings.json, claude.model). "Standard" = kein --model, es gilt die Einstellung von Claude Code.

Tabs Projekte, Standard-Ordnerstruktur, Sync-Defaults und Über sind tote Pfade (gestrichelt, „Mockup folgt“).
-->
<style>
  .rahmen{background:var(--BpmBgBase);font-family:'Segoe UI',sans-serif;color:var(--BpmTextPrimary);font-size:13px}
  .app{display:flex;height:100%}
  .sb{width:200px;background:var(--BpmBgSurface);border-right:1px solid var(--BpmBorderSubtle);padding:12px 0;flex-shrink:0}
  .sb-title{font-size:13px;font-weight:600;color:var(--BpmTextBright);padding:4px 16px 14px}
  .sb-it{padding:7px 16px;font-size:12px;color:var(--BpmTextSecondary);cursor:pointer}
  .sb-it.act{background:var(--BpmBgActive);color:var(--BpmAccentPrimary)}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .hdr{padding:16px 24px 8px;font-size:20px;font-weight:600;color:var(--BpmTextBright)}
  .tabs{padding:0 24px;display:flex;gap:0;border-bottom:1px solid #3E3E42;background:var(--BpmBgSurface)}
  .tab{padding:12px 20px;font-size:13px;color:var(--BpmTextSecondary);cursor:pointer;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color 0.15s}
  .tab:hover{color:var(--BpmTextPrimary);background:var(--BpmBgElevated)}
  .tab.act{color:var(--BpmTextBright);font-weight:600;border-bottom-color:var(--BpmAccentPrimary);background:var(--BpmBgBase)}
  .content{flex:1;padding:20px 24px;overflow-y:auto}
  .sec-title{color:var(--BpmAccentPrimary);font-weight:bold;font-size:13px;margin:0 0 8px}
  .placeholder{color:var(--BpmTextSecondary);font-size:11px;font-style:italic;margin:0 0 20px}
  .divider{height:1px;background:#3E3E42;margin:0 0 12px}
  .field{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
  .field-label{color:var(--BpmTextPrimary);font-size:13px}
  .field-input{background:var(--BpmBgBase);border:1px solid #3E3E42;color:var(--BpmTextPrimary);padding:5px 8px;font-size:11px;font-family:'Segoe UI'}
  .field-btn{background:transparent;border:1px solid #3E3E42;color:var(--BpmTextPrimary);padding:5px 10px;font-size:11px;cursor:pointer}
  .field-auto{color:var(--BpmTextSecondary);font-size:10px;padding:0 4px}
  .status{height:24px;background:var(--BpmAccentPrimary);color:var(--BpmTextOnAccent);font-size:10px;display:flex;align-items:center;padding:0 12px;flex-shrink:0}
</style>
</head>
<body>
<template id="t-app">
<div class="app">
  <div class="sb">
    <div class="sb-title">BauProjektManager</div>
    <div class="sb-it" onclick="Mockup.geh('projektuebersicht')">📁 PlanManager</div>
    <div class="sb-it act">⚙ Einstellungen</div>
    <div class="sb-it" onclick="Mockup.geh('dev-log')">🔧 Dev Tools</div>
  </div>
  <div class="main">
    <div class="hdr">⚙ Einstellungen</div>
    <div class="tabs">
      <div class="tab act">Allgemein</div>
      <div class="tab" style="border-bottom:3px dashed var(--BpmTextSecondary);opacity:0.7" onclick="alert('Mockup folgt: 01_Einstellungen/02_Projekte.html')">Projekte</div>
      <div class="tab" style="border-bottom:3px dashed var(--BpmTextSecondary);opacity:0.7" onclick="alert('Mockup folgt: 01_Einstellungen/03_StandardOrdnerstruktur.html')">Standard-Ordnerstruktur</div>
      <div class="tab" style="border-bottom:3px dashed var(--BpmTextSecondary);opacity:0.7" onclick="alert('Mockup folgt: 01_Einstellungen/04_SyncDefaults.html')">Sync-Defaults</div>
      <div class="tab" style="border-bottom:3px dashed var(--BpmTextSecondary);opacity:0.7" onclick="alert('Mockup folgt: 01_Einstellungen/05_Ueber.html')">Über</div>
    </div>
    <div class="content">
      <div class="sec-title">── Sprache &amp; Theme ──</div>
      <div class="placeholder">Sprache und Theme — Inhalt kommt in 079.04</div>
      <div class="divider"></div>
      <div class="sec-title">── Pfade ──</div>
      <div class="field">
        <div class="field-label">Arbeitsordner:</div>
        <input class="field-input" value="D:\OneDrive\Dokumente\02 Arbeit\16_Testläufe" readonly>
        <button class="field-btn">📁</button>
      </div>
      <div class="field">
        <div class="field-label">Archivordner:</div>
        <input class="field-input" value="" readonly>
        <button class="field-btn">📁</button>
      </div>
      <div class="field">
        <div class="field-label">Cloud-Speicher:</div>
        <input class="field-input" value="D:\OneDrive" readonly>
        <div class="field-auto">(auto)</div>
      </div>
      <div class="divider" style="margin-top:20px"></div>
      <div class="sec-title">── Claude ──</div>
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" checked onchange="document.getElementById('mdl').disabled=!this.checked"> „Mit Claude sortieren“ im PlanManager einschalten</label>
      <div class="placeholder" style="font-style:normal;margin:4px 0 12px 22px;max-width:640px;line-height:1.5">Claude Code auf diesem PC schlägt Zuordnungen für neue Pläne vor. Dabei gehen Dateinamen, die Stammdaten des Projekts und – wenn du es beim Start ankreuzt – der Plankopf-Text über dein Claude-Abo an Anthropic. Importiert wird erst, wenn du bestätigst. Gilt nur für dieses Gerät.</div>
      <div class="field" style="margin-left:22px;grid-template-columns:88px 220px 1fr">
        <div class="field-label">Modell:</div>
        <select id="mdl" class="field-input" style="font-size:12px">
          <option>Standard von Claude Code</option>
          <option>Sonnet – schneller, sparsamer</option>
          <option>Opus – gründlicher, langsamer</option>
        </select>
        <div class="field-auto">gilt ab dem nächsten Auftrag</div>
      </div>
    </div>
    <div class="status">1 Projekte geladen</div>
  </div>
</div>
</template>
<script>
const APP = document.getElementById('t-app').innerHTML;
Mockup.start({ nr: '2.1', titel: 'Allgemein', version: '1.1', zeige: () => APP });
</script>
</body>
</html>
