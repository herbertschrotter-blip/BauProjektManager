<!--
3.2 Explorer – aus altem Mockup PlanManager/02_Projektdetail/04_Explorer.html übernommen
(alter Titel „BPM PlanManager — Projektdetail Explorer“). Kommentar des alten Mockups:
  BPM-112.06 In-App-Explorer (ADR-060 Slice 6) — Variante A: 4. Tab in Projektdetail.
  Spezifikation:
  - Live-Dateisystem des Projektroots via IFileSystemReader (ADR-061 P.6 Modell A:
    DB = kuratierter Index NUR der erfassten Plandokumente, KEIN Vollspiegel).
  - Getrackte Dateien (plan_documents/plan_revisions) tragen Badge "Getrackt · <Index>";
    Verschieben AKTIV über den journalisierten ArchiveMoveService (Ordner-Wahl, alle Dateien
    der Revision gemeinsam, Journal-Action VOR Move — Entscheidung Herbert Teil 50).
    Freies Verschieben und Löschen GESPERRT (kein Lösch-Workflow in V1 außer Import-Undo).
    Reklassifizierung (Move ändert fachliche Zuordnung) bleibt Domain-Workflow, ADR-064 P.11.
  - Drift-Badges aus Startup-Reconcile (nur getrackte Teilmenge, Exists+Size first):
    "Fehlt auf Disk" (MissingOnDisk, rot) · "Geändert" (ChangedOnDisk, orange) ·
    RelinkCandidate erscheint als Vorschlag im PlanManager, nicht als Explorer-Aktion.
  - Toolbar: Öffnen (IFileLauncher.OpenFile) · Im Windows-Explorer (RevealInExplorer/OpenFolder)
    · Pfad kopieren (CopyPathToClipboard) — ADR-060 P.3-Ergänzungen.
  - IShareService (Windows-Share-Sheet) später; Cloud-Share-Links out-of-scope (ADR-064 P.11).
Rahmen: .shell füllt den Rahmen (statt 1100 px / min. 560 px), Rand und Rundung kommen vom Rahmen.
Wege: ← und PlanManager → 3.1, Einstellungen → 2.1, Tabs → 3.3 / 3.5 / 3.6, „Im PlanManager anzeigen (Archiv)“ → 3.3;
Sync bleibt alert (noch kein Mockup).
-->
