3.5 Plandaten – aus altem Mockup PlanManager/02_Projektdetail/05_Plandaten.html übernommen
(alter Titel „BPM PlanManager — Projektdetail Plandaten“). Inhalt unverändert, nur Rahmen und Farben als Theme-Tokens.

  BPM-112.06-Umfeld — DB-Ansicht "Plandaten" (eigener Tab in Projektdetail).
  Spezifikation:
  - Read-only-Tabellensicht auf den kuratierten Planindex (plan_documents + aktuelle
    plan_revisions + plan_document_segments, Schema v2.0 / ADR-058).
  - Spalten: Plan-Nr · Idx · Bezeichnung · Typ · Bauteil · Geschoss · Index-Datum ·
    Änderungshinweis · Dateien · Segmente (Anzahl-Chip; Details im Panel).
  - KLARSTELLUNG (Herbert, Teil 50): Segmente = DATEINAMENS-Segmente (BPM-108-Typen:
    Plannummer/Planindex/Planart/Bauteil/Geschoss/Bezeichnung...) mit Wert + Quelle
    (Dateiname geparst / Radial-Zuordnung / PDF-Markierung / manuell). Inhaltliche
    Auszeichnungen wie "Beton: C25/30" sind TAGS — NEUES Konzept (Entscheidung Herbert
    Teil 50, eigener Task): freie Tags pro Dokument, neue Tabelle plan_document_tags,
    Vorschläge aus bereits verwendeten Projekt-Tags, Filter-/Suchintegration im Tab.
  - Zeile selektieren -> Detail-Panel unten: alle Eigenschaften (document_key, Pfad,
    Dateien mit Größe/MD5, Revisions-Historie, Segmente mit Quelle/Datum, Import-Info).
  - Toolbar: Suche + Filter (Dokumenttyp, Bauteil). Export bewusst NICHT hier —
    Planlisten-Export Excel+PDF ist ein eigener Task (BPM-031, post-V1).
  - Segmente nachträglich editierbar (Entscheidung Herbert Teil 50) — Interaktionsmuster
    = Segment-Wizard aus ProfilWizard Schritt 2 (02_Segmente.html), NICHT neu erfinden.
    EINE kombinierte Fläche (Entscheidung Herbert Teil 50):
    (1) Token-Flächen (Wert + Typ-Label, Feldtyp-Farben aus Colors.xaml) tragen die
        klickbaren TRENNZEICHEN direkt zwischen sich — Trenner-Klick deaktiviert ihn
        (Nachbar-Segmente verschmelzen) bzw. aktiviert ihn wieder (teilen). Globale
        Trenner-Chips (- _ . Leerzeichen) rechts. Beispiel "5998-130" = Plannr.-Token
        mit intern deaktiviertem '-'.
    (2) Segmenttyp per Drag & Drop aus der Chip-Palette auf eine Token-Fläche ziehen.
    (3) "⚙ Segmenttypen verwalten…" öffnet den BESTEHENDEN FeldtypManager (BPM-108);
        Palette aus ISegmentTypeCatalog.GetEffectiveActive(), "+ Eigenes" = Inline-Popover.
    WPF: Wizard-Segmentfläche als wiederverwendbares Control bauen (080.05 steht noch aus —
    ein Control für Wizard UND Plandaten). Persistenz via PlanManagerDatabase.UpsertSegment
    (reiner DB-Write, kein Journal — BPM-118-Metadaten bewusst außerhalb der Import-TX, ADR-064).
  - Struktur-Änderungen (Pfad, Revision, Dateien) weiter NUR über Import/Radial/Archiv-Workflows.

Wege: Sidebar PlanManager und ← → 3.1 Projektübersicht · Einstellungen → 2.1 Allgemein · Tabs Explorer / Manuell
sortieren / Profile → 3.2 / 3.3 / 3.6 · „Im Explorer zeigen“ → 3.2 · „Segmenttypen verwalten…“ → 3.9 · Sync bleibt
alert (Mockup folgt, BPM-005).
Farben ohne Theme-Token (Hex stehen gelassen): #2a2418 (Eingang-Hinweis), #D6F2F7/#D9F4E9/#E7E5FA (Chip-Schrift),
#224EC94E (Badge „aktuelle Revision“, WPF-ARGB) → jetzt --BpmBadgeBgSuccess (Entscheidung Herbert 2026-11-19),
rgba(0,120,212,0.3) (Hover-Schatten).
-->
