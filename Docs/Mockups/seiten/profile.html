<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3.6 Erkennung</title>
<link rel="stylesheet" href="../theme-app.css">
<script src="../theme.js"></script>
<!--
3.6 Erkennung (früher „Profile“) – BPM-121.00, abgenommen 2026-11-19 (Herbert); Regex-Regel nur bei Typen mit Erkennung, sonst zuerst anlernen (ADR-065 P.7: document_types ist das fachliche Hauptobjekt,
das Erkennungsprofil hängt 0..1 am Dokumenttyp; der Tab ist eine Dokumenttyp-Ansicht, keine eigene Profil-Verwaltung).
Herkunft: aus altem Mockup PlanManager/02_Projektdetail/01_Profile.html übernommen (Version 1.1), Aufbau der Liste wie im
Code (DocumentTypeOverviewViewModel: Gruppen je Ablagebereich, Karte je Dokumenttyp mit Ordner, Kategorien, „Vorlage“).

Neu (121.00):
  - Tab heißt „Erkennung“ (UI-Begriff; „Erkennungsprofil“ nur in der Doku, Code-Name bleibt RecognitionProfile).
  - Status je Dokumenttyp: „Nicht angelernt“ (kein Profil) · „Aktiv“ (ProfileHealth.Valid) · „Defekt“
    (MissingSegmentTypes – fehlende Segmenttypen werden genannt). „Inaktiv“/„Lernend“ kommen mit 121.02.
  - Regeln kurz: „enthält „Polierplan““ (segment ohne Position, BPM-130) bzw. „Regex ^B-\d+“.
  - Aktionen: „Erkennung anlernen“ (kein Profil) → 3.8 Wizard mit vorgewähltem Typ; „✎ Bearbeiten“ → 3.8 mit dem
    vorhandenen Profil; „Regex-Regel…“ (nur mit Profil) → Dialog; „🗑“ → Erkennung löschen (nur das Profil; Dokumenttyp,
    Ablage und Dokumente bleiben – asymmetrisch, P.7).
  - Regex-Dialog: Pattern (Consolas), Hilfetext, Beispiel-Dateiname, Live-Test (Treffer / kein Treffer); ungültiges
    Pattern → Meldung „Ungültiges Regex-Pattern: …“, Speichern gesperrt (Prüfung mit demselben Timeout wie
    DocumentTypeRecognizer.MatchesRegex, ReDoS-Schutz).
Zustände: Übersicht · Regex-Regel (gültig) · Regex-Regel (ungültig) · Erkennung löschen.
Wege: ← und PlanManager → 3.1, Einstellungen → 2.1, Tabs → 3.2 / 3.3 / 3.5, Anlernen/Bearbeiten → 3.8; Sync bleibt alert.
-->
<style>
  .rahmen *{box-sizing:border-box;margin:0;padding:0}
  .shell{background:var(--BpmBgBase);font-size:13px;color:var(--BpmTextPrimary);display:flex;flex-direction:column;width:100%;height:100%;position:relative}
  .tab{background:none;border:none;color:var(--BpmTextSecondary);padding:7px 14px;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
  .tab.on{color:var(--BpmAccentPrimary);border-bottom-color:var(--BpmAccentPrimary)}
  .grp{font-size:11px;font-weight:600;color:var(--BpmTextSecondary);margin:0 0 5px}
  .card{background:var(--BpmBgBase);border:1px solid var(--BpmBorderSubtle);border-radius:4px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
  .nm{font-size:13px;font-weight:600;color:var(--BpmTextBright)}
  .vl{background:var(--BpmBgElevated);border-radius:3px;padding:1px 6px;font-size:9px;color:var(--BpmTextSecondary);margin-left:8px}
  .sub{font-size:11px;margin-top:3px;color:var(--BpmTextPrimary)}
  .sub i{font-style:normal;color:var(--BpmTextSecondary);margin-left:10px}
  .rule{font-family:Consolas,monospace;font-size:11px;color:var(--BpmTextSecondary);margin-top:3px}
  .st{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .st.ok{background:var(--BpmBadgeBgSuccess);color:var(--BpmSuccess)}
  .st.no{background:var(--BpmBgElevated);color:var(--BpmTextSecondary)}
  .st.err{background:var(--BpmBadgeBgError);color:var(--BpmError)}
  .btn{background:transparent;border:1px solid var(--BpmBorderDefault);color:var(--BpmTextPrimary);height:26px;padding:0 10px;border-radius:3px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--BpmBgHover)}
  .btnP{background:var(--BpmAccentPrimary);border:none;color:var(--BpmTextOnAccent);height:26px;padding:0 12px;border-radius:3px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
  .btnP:hover{background:var(--BpmAccentHover)}
  .btnP:disabled{opacity:.4;cursor:default}
  .ico{background:transparent;border:1px solid transparent;color:var(--BpmTextSecondary);height:26px;width:26px;border-radius:3px;cursor:pointer;font-size:12px}
  .ico:hover{background:var(--BpmBgHover);color:var(--BpmError)}
  .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  .dlg{width:560px;background:var(--BpmBgSurface);border:1px solid var(--BpmBorderDefault);border-radius:6px}
  .dlg .hd{padding:10px 16px;border-bottom:1px solid var(--BpmBorderDefault);color:var(--BpmTextBright);font-weight:600}
  .dlg .bd{padding:14px 16px}
  .dlg .ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--BpmBorderDefault)}
  .lbl{color:var(--BpmTextSecondary);font-size:12px;margin:10px 0 4px}
  .lbl:first-child{margin-top:0}
  .inp{width:100%;background:var(--BpmBgInput);border:1px solid var(--BpmBorderDefault);color:var(--BpmTextBright);padding:6px 8px;border-radius:3px;font:inherit}
  .inp.mono{font-family:Consolas,monospace}
  .inp.bad{border-color:var(--BpmError)}
  .hint{color:var(--BpmTextSecondary);font-size:11px;line-height:1.5;margin-top:4px}
  .res{margin-top:10px;padding:8px 10px;border-left:3px solid;background:var(--BpmBgBase);font-size:12px}
</style>
</head>
<body>
<script>
const M = Mockup;

const TYPEN = [
  ['01 Planunterlagen', [
    {n:'Polierplan', ord:'01 Polierpläne', kat:'', vorlage:true, st:'ok', regeln:['enthält „Polierplan“']},
    {n:'Bewehrungsplan', ord:'02 Bewehrungspläne', kat:'', vorlage:true, st:'ok', regeln:['Regex ^B-\\d+']},
    {n:'Schalungsplan', ord:'03 Schalungspläne', kat:'', vorlage:true, st:'err', fehlt:'haus', regeln:['enthält „Schalung“']},
    {n:'Fertigteile', ord:'04 Fertigteile', kat:'3 Kategorien', vorlage:false, st:'no'},
  ]],
  ['04 Protokolle', [
    {n:'Baubesprechung', ord:'— direkt im Ablagebereich', kat:'', vorlage:true, st:'no'},
  ]],
];

function status(t){
  if (t.st === 'ok') return '<span class="st ok">● Aktiv</span>';
  if (t.st === 'err') return `<span class="st err" title="Profil verweist auf einen gelöschten Segmenttyp">● Defekt – Segmenttyp „${t.fehlt}“ fehlt</span>`;
  return '<span class="st no">○ Nicht angelernt</span>';
}
function aktionen(t){
  if (t.st === 'no') return `<button class="btnP" onclick="M.geh('profil-wizard')">Erkennung anlernen</button>`;
  return `<button class="btn" onclick="M.geh('profil-wizard')">✎ Bearbeiten</button>
    <button class="btn" onclick="M.setz('z','regex')">Regex-Regel…</button>
    <button class="ico" title="Erkennung löschen" onclick="M.setz('z','loeschen')">🗑</button>`;
}
function karte(t){
  return `<div class="card">
    <div style="flex:1;min-width:0">
      <div><span class="nm">${t.n}</span>${t.vorlage ? '<span class="vl">Vorlage</span>' : ''}</div>
      <div class="sub">${t.ord}${t.kat ? `<i>${t.kat}</i>` : ''}</div>
      ${t.regeln ? `<div class="rule">Erkennung: ${t.regeln.join(' · ')}</div>` : ''}
    </div>
    ${status(t)}
    <div style="display:flex;gap:6px;align-items:center">${aktionen(t)}</div>
  </div>`;
}
function liste(){
  return `<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn">+ Neuer Dokumenttyp</button><span style="flex:1"></span>
      <button class="ico" style="color:var(--BpmTextSecondary)" title="Neu laden">⟳</button></div>
    ${TYPEN.map(([g, ts]) => `<div style="margin-bottom:14px"><div class="grp">${g}</div>${ts.map(karte).join('')}</div>`).join('')}
    <div style="font-size:11px;color:var(--BpmTextSecondary)">5 Dokumenttyp(en) in 2 Ablagebereich(en) · 3 mit Erkennung, 1 defekt</div>`;
}

function regex(gueltig){
  const pat = gueltig ? '^B-\\d{3}' : '^B-\\d{3';
  return `<div class="ov"><div class="dlg">
    <div class="hd">Regex-Regel für „Bewehrungsplan“</div>
    <div class="bd">
      <div class="lbl">Muster</div>
      <input class="inp mono ${gueltig ? '' : 'bad'}" value="${pat}">
      <div class="hint">Regulärer Ausdruck, ohne Groß-/Kleinschreibung, gegen den Dateinamen ohne Endung. Die Regel gilt
        zusätzlich zu den Regeln aus dem Wizard („enthält …“).</div>
      ${gueltig ? '' : `<div class="res" style="border-color:var(--BpmError);color:var(--BpmError)">Ungültiges Regex-Pattern: Nicht abgeschlossenes {}-Quantifizierer bei Position 9.</div>`}
      <div class="lbl">Beispiel-Dateiname</div>
      <input class="inp mono" value="B-101_Bewehrung_OG1">
      <div class="hint">Aus dem Eingang vorbelegt, frei änderbar.</div>
      ${gueltig ? `<div class="res" style="border-color:var(--BpmSuccess);color:var(--BpmSuccess)">✓ Treffer bei „B-101_Bewehrung_OG1“</div>` : ''}
      <div class="lbl">Regeln dieser Erkennung</div>
      <div class="rule" style="margin:0">Regex ^B-\\d+ <span style="color:var(--BpmTextSecondary)">(wird ersetzt)</span></div>
    </div>
    <div class="ft"><button class="btn" onclick="M.setz('z','liste')">Abbrechen</button>
      <button class="btnP" ${gueltig ? '' : 'disabled'} onclick="M.setz('z','liste')">Speichern</button></div>
  </div></div>`;
}

function loeschen(){
  return `<div class="ov"><div class="dlg" style="width:460px">
    <div class="hd">Erkennung für „Schalungsplan“ löschen?</div>
    <div class="bd" style="line-height:1.55">Die Erkennung (Segmente, Regeln) wird entfernt. Der Dokumenttyp, sein Ablageordner
      und alle Dokumente bleiben. Danach steht der Typ auf „Nicht angelernt“ und kann neu angelernt werden.</div>
    <div class="ft"><button class="btn" onclick="M.setz('z','liste')">Abbrechen</button>
      <button class="btnP" style="background:var(--BpmError)" onclick="M.setz('z','liste')">Erkennung löschen</button></div>
  </div></div>`;
}

function seite(s){
  const inhalt = liste();
  const dialog = s.z === 'regex' ? regex(true) : s.z === 'regexf' ? regex(false) : s.z === 'loeschen' ? loeschen() : '';
  return `<div class="shell">
<div style="display:flex;flex:1;min-height:0">
<div style="width:200px;background:var(--BpmBgSurface);border-right:1px solid var(--BpmBorderSubtle);display:flex;flex-direction:column;padding:12px 0;flex-shrink:0">
<div style="font-size:13px;font-weight:600;color:var(--BpmTextBright);padding:4px 16px 14px">BauProjektManager</div>
<div style="background:var(--BpmBgActive);color:var(--BpmAccentPrimary);padding:7px 16px;font-size:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="M.geh('projektuebersicht')">
<span>&#128193; PlanManager</span>
<span style="background:var(--BpmWarning);color:var(--BpmBgBase);font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px">15</span>
</div>
<div style="color:var(--BpmTextSecondary);padding:7px 16px;font-size:12px;cursor:pointer" onclick="M.geh('einstellungen-allgemein')">&#9881; Einstellungen</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
<div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--BpmBgSurface);border-bottom:1px solid var(--BpmBorderSubtle);min-height:36px">
<button style="background:none;border:none;color:var(--BpmTextSecondary);cursor:pointer;font-size:14px;font-family:inherit;padding:2px 6px;border-radius:3px" onclick="M.geh('projektuebersicht')">&#8592;</button>
<span style="font-size:13px;font-weight:500;color:var(--BpmTextBright);flex:1">&#214;WG Dobl-Zwaring</span>
<button style="background:transparent;color:var(--BpmTextPrimary);border:1px solid var(--BpmBorderDefault);padding:4px 10px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit">&#10227; R&#252;ckg&#228;ngig</button>
<button style="background:var(--BpmAccentPrimary);color:var(--BpmTextOnAccent);border:none;padding:5px 14px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit">Import starten</button>
</div>
<div style="padding:5px 14px;background:#2a2418;border-bottom:1px solid var(--BpmBorderSubtle);font-size:11px;color:var(--BpmWarning)">&#9889; 15 im Eingang &middot; 3 vom Server-Sync</div>
<div style="display:flex;border-bottom:1px solid var(--BpmBorderSubtle);background:var(--BpmBgSurface)">
<button class="tab" onclick="M.geh('explorer')">Explorer</button>
<button class="tab" onclick="M.geh('manuell-sortieren')">Manuell sortieren</button>
<button class="tab" onclick="M.geh('plandaten')">Plandaten</button>
<button class="tab on">Erkennung</button>
<button class="tab" style="border-bottom:2px dashed var(--BpmTextSecondary);opacity:.7" onclick="alert('Mockup folgt: Sync (BPM-005)')">Sync</button>
</div>
<div style="flex:1;overflow-y:auto;padding:12px 14px">${inhalt}</div>
</div>
</div>
<div style="height:24px;background:var(--BpmAccentPrimary);display:flex;align-items:center;padding:0 12px;font-size:10px;color:var(--BpmTextOnAccent);flex-shrink:0">
<span>&#214;WG &middot; 5 Dokumenttypen &middot; 119 Dok.</span><span style="margin-left:auto">15 im Eingang</span>
</div>
${dialog}
</div>`;
}

M.start({ nr: '3.6', titel: 'Erkennung', version: '2.1',
  zustaende: [['liste','Übersicht'],['regex','Regex-Regel'],['regexf','Regex ungültig'],['loeschen','Erkennung löschen']],
  zeige: seite,
});
</script>
</body>
</html>
