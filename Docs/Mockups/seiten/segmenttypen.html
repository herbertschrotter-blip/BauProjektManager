<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3.9 Segmenttypen</title>
<link rel="stylesheet" href="../theme-app.css">

<!--
3.9 Segmenttypen – aus altem Mockup PlanManager/04_FeldtypManager/01_Uebersicht.html übernommen
(alter Titel „BPM Segmenttyp-Manager — Uebersicht mit Gruppen + Edit“). Inhalt unverändert, nur Rahmen und Farben als
Theme-Tokens. Ein Screen ohne Umschalter; die Demo-Zustände stehen nebeneinander in der Liste:
  - Gruppe Identifikation (Built-in), Gruppe Räumlich (Built-in, „Geschoss“ ausgewählt)
  - Gruppe Inhaltlich (Built-in, eingeklappt — Demo Collapsed-State)
  - Gruppe Sonstiges (Built-in) — komplett deaktiviert (Demo: Group-Toggle aus)
  - Gruppe Bauphysik (Custom) — löschbar weil nicht leer? Nein: locked solange Items drin
  - Gruppe Notizen (Custom, leer) — löschbar
  - Edit-Panel: Built-in (Geschoss) — kein Trash, Fachrolle + Token read-only
  - Read-only Felder fuer Built-ins (Fachrolle, Token)
Wege: Fenster-Schließen (rot) und „Schließen“ → 3.8 Profil-Wizard (alt: 03_ProfilWizard/02_Segmente.html).
Farben ohne Theme-Token (Hex stehen gelassen): #666 (Griffe, Lösch-Icons, Palette-Hinweis), #6E6E6E (Swatches ohne
Feldtyp-Farbe), #1A8AE0 (Hover der Primärknöpfe) → jetzt --BpmAccentHover (Entscheidung Herbert 2026-11-19), #3E3E42 (Rahmen Eingabefelder),
#9CDCFE (Token-Schrift mono), #A87142 (Akustik-Klasse), Palette #7A1F5C #A87142 #3D7B47 #8B6914 #5C3D8E #2E7D8A,
rgba(0,120,212,0.1) rgba(240,173,78,0.18) rgba(244,71,71,0.12) rgba(255,255,255,0.08).
-->
<style>
  .dialog{width:100%;height:100%;background:var(--BpmBgBase);border:1px solid var(--BpmBorderDefault);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;font-family:'Segoe UI',sans-serif;color:var(--BpmTextPrimary);font-size:13px;border:none;border-radius:0}

  /* Window-Title */
  .dialog-title{background:var(--BpmBgSurface);padding:10px 16px;border-bottom:1px solid var(--BpmBorderDefault);display:flex;justify-content:space-between;align-items:center}
  .dialog-title-text{color:var(--BpmTextBright);font-size:13px;font-weight:600}
  .win-controls{display:flex;gap:8px}
  .win-btn{width:12px;height:12px;border-radius:50%;background:var(--BpmBgInput)}
  .win-btn.close{background:var(--BpmError);cursor:pointer}

  /* Header */
  .header{background:var(--BpmBgSurface);padding:14px 16px;border-bottom:1px solid var(--BpmBorderSubtle)}
  .header-title{color:var(--BpmTextBright);font-size:15px;font-weight:600;margin:0 0 4px}
  .header-hint{color:var(--BpmTextSecondary);font-size:11px}

  /* Toolbar */
  .toolbar{padding:10px 16px;background:var(--BpmBgBase);border-bottom:1px solid var(--BpmBorderSubtle);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .toolbar-info{color:var(--BpmTextSecondary);font-size:11px}
  .toolbar-buttons{display:flex;gap:6px}
  .btn-new{background:var(--BpmAccentPrimary);color:var(--BpmTextOnAccent);border:none;border-radius:3px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Segoe UI'}
  .btn-new:hover{background:var(--BpmAccentHover)}
  .btn-new.secondary{background:transparent;border:1px solid var(--BpmAccentPrimary);color:var(--BpmAccentPrimary)}
  .btn-new.secondary:hover{background:rgba(0,120,212,0.1)}

  /* Body: 2-Spalten */
  .body{flex:1;display:flex;min-height:0}

  /* Liste */
  .list-pane{flex:1;border-right:1px solid var(--BpmBorderSubtle);overflow-y:auto;padding:4px 0}

  /* Gruppen-Header */
  .group{padding:0}
  .group-head{display:grid;grid-template-columns:30px 16px 14px 1fr auto;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;background:var(--BpmBgSurface);border-bottom:1px solid var(--BpmBorderSubtle);border-top:1px solid var(--BpmBorderSubtle)}
  .group-head:first-child{border-top:none}
  .group-toggle{width:30px;height:16px;border-radius:8px;background:var(--BpmBgInput);position:relative;cursor:pointer;flex-shrink:0}
  .group-toggle.on{background:var(--BpmFieldPlanNumber)}
  .group-toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--BpmTextPrimary)}
  .group-toggle.on::after{left:16px;background:var(--BpmTextBright)}
  .caret{color:var(--BpmTextSecondary);font-size:9px;line-height:1;transition:transform 0.15s}
  .caret.collapsed{transform:rotate(-90deg)}
  .group-grip{color:#666;font-size:13px;cursor:grab;line-height:1}
  .group-name{color:var(--BpmTextBright);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  .group-count{color:var(--BpmTextSecondary);font-size:10px;font-weight:400}
  .group-actions{color:var(--BpmTextSecondary);font-size:11px;cursor:pointer}
  .group-actions:hover{color:var(--BpmAccentPrimary)}

  /* Group inactive: alles drinnen gedimmt */
  .group.inactive .item{opacity:0.4}
  .group.inactive .group-name{color:var(--BpmTextSecondary)}

  /* Items */
  .item{display:grid;grid-template-columns:30px 16px 14px 1fr auto auto;gap:8px;align-items:center;padding:7px 12px 7px 24px;cursor:pointer;border-left:3px solid transparent}
  .item:hover{background:var(--BpmBgSurface)}
  .item.sel{background:var(--BpmBgActive);border-left-color:var(--BpmAccentPrimary)}
  .item.inactive{opacity:0.45}
  .item-toggle{width:30px;height:16px;border-radius:8px;background:var(--BpmBgInput);position:relative;cursor:pointer;flex-shrink:0}
  .item-toggle.on{background:var(--BpmFieldPlanNumber)}
  .item-toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--BpmTextPrimary)}
  .item-toggle.on::after{left:16px;background:var(--BpmTextBright)}
  .grip{color:#666;font-size:13px;line-height:1;user-select:none;cursor:grab}
  .swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,0.08)}
  .name-row{display:flex;align-items:center;gap:6px;min-width:0}
  .name{color:var(--BpmTextBright);font-size:12px;white-space:nowrap}
  .badge{font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;letter-spacing:0.3px;flex-shrink:0}
  .badge.builtin{background:var(--BpmBgHover);color:var(--BpmTextSecondary)}
  .badge.custom{background:var(--BpmBgActive);color:var(--BpmInfo)}
  .badge.req{background:rgba(240,173,78,0.18);color:var(--BpmWarning)}
  .icon-del{color:#666;cursor:pointer;font-size:13px;padding:0 4px;line-height:1}
  .icon-del:hover{color:var(--BpmError)}
  .icon-del.disabled{visibility:hidden}

  /* Group-Body collapsed */
  .group.collapsed .item{display:none}

  /* Group-Head Lösch-Icon */
  .group-head .icon-del{color:#666;cursor:pointer;font-size:13px;padding:0 4px;line-height:1;margin-left:6px}
  .group-head .icon-del:hover{color:var(--BpmError)}
  .group-head .icon-del.disabled{visibility:hidden}
  .group-head .icon-del.locked{color:var(--BpmBorderDefault);cursor:not-allowed}
  .group-head .icon-del.locked:hover{color:var(--BpmBorderDefault)}

  /* Edit-Panel rechts */
  .edit-pane{width:280px;background:var(--BpmBgSurface);display:flex;flex-direction:column;padding:14px 16px;flex-shrink:0}
  .edit-title{color:var(--BpmTextBright);font-size:13px;font-weight:600;margin:0 0 12px}
  .edit-actions{margin-top:auto;display:flex;gap:8px;justify-content:flex-end}
  .edit-label{color:var(--BpmTextSecondary);font-size:11px;margin:0 0 4px;text-transform:uppercase;letter-spacing:0.4px}
  .edit-input{background:var(--BpmBgBase);border:1px solid #3E3E42;border-radius:3px;color:var(--BpmTextBright);font-size:13px;padding:7px 9px;width:100%;box-sizing:border-box;outline:none;font-family:'Segoe UI';margin-bottom:14px}
  .edit-input:focus{border-color:var(--BpmBorderFocus)}
  .name-row-edit{display:flex;align-items:stretch;gap:6px;margin-bottom:14px}
  .name-row-edit .edit-input{margin-bottom:0;flex:1}
  .btn-trash{background:transparent;border:1px solid var(--BpmError);border-radius:3px;color:var(--BpmError);font-size:14px;cursor:pointer;font-family:'Segoe UI';padding:0 10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .btn-trash:hover{background:rgba(244,71,71,0.12)}
  .edit-select{background:var(--BpmBgBase);border:1px solid #3E3E42;border-radius:3px;color:var(--BpmTextBright);font-size:13px;padding:7px 9px;width:100%;box-sizing:border-box;outline:none;font-family:'Segoe UI';margin-bottom:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .palette{display:grid;grid-template-columns:repeat(6, 1fr);gap:6px;margin-bottom:6px}
  .color-swatch{aspect-ratio:1;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform 0.1s}
  .color-swatch:hover{transform:scale(1.06)}
  .color-swatch.sel{border-color:var(--BpmTextBright)}
  .palette-hint{color:#666;font-size:10px;margin:0 0 14px;font-style:italic}

  /* Read-only Felder fuer Built-ins (Fachrolle, Token) */
  .ro-block{background:var(--BpmBgBase);border:1px solid var(--BpmBorderSubtle);border-radius:3px;padding:7px 9px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .ro-value{color:var(--BpmTextPrimary);font-size:12px}
  .ro-value.mono{font-family:Consolas,monospace;color:#9CDCFE}
  .ro-lock{color:#666;font-size:10px;margin-left:auto}
  .ro-hint{color:var(--BpmTextSecondary);font-size:10px;margin:0 0 14px;line-height:1.4;padding:0 2px;display:flex;gap:4px;align-items:flex-start}
  .ro-hint .ro-icon{color:var(--BpmAccentPrimary);flex-shrink:0}

  .edit-actions{margin-top:auto;display:flex;gap:8px;justify-content:flex-end}
  .btn{background:transparent;border:1px solid var(--BpmBorderDefault);border-radius:3px;color:var(--BpmTextPrimary);font-size:12px;cursor:pointer;font-family:'Segoe UI';padding:6px 14px}
  .btn:hover{background:var(--BpmBgHover);border-color:var(--BpmAccentPrimary)}
  .btn-primary{background:var(--BpmAccentPrimary);border:none;color:var(--BpmTextOnAccent);font-weight:500}
  .btn-primary:hover{background:var(--BpmAccentHover)}

  /* Footer */
  .footer{background:var(--BpmBgSurface);padding:12px 16px;border-top:1px solid var(--BpmBorderDefault);display:flex;justify-content:flex-end;align-items:center;gap:8px}
</style>
</head>
